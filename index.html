<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Toolkit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>AI Agent <span>Toolkit</span></h1>
    <button id="settings-btn" title="设置">⚙️</button>
  </header>

  <main>
    <section id="chat-panel">
      <div id="chat-messages"></div>
      <div id="input-area">
        <textarea id="user-input" placeholder="输入任务，例如：帮我计算 (123 + 456) × 789 的结果，然后搜索一下今天的科技新闻..." rows="1"></textarea>
        <button id="send-btn">发送</button>
      </div>
    </section>

    <section id="tracking-panel-wrap">
      <div id="tracking-panel-header">Agent 追踪</div>
      <div id="tracking-panel"></div>
    </section>
  </main>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>API 配置</h2>
      <form id="settings-form">
        <div class="form-group">
          <label for="api-endpoint">API Endpoint</label>
          <input type="url" id="api-endpoint" placeholder="https://api.openai.com/v1" required>
          <small>支持 OpenAI 兼容接口（DeepSeek、通义千问等）</small>
        </div>
        <div class="form-group">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" placeholder="sk-..." required>
          <small>密钥仅存储在浏览器本地，不会上传到任何服务器</small>
        </div>
        <div class="form-group">
          <label for="api-model">Model</label>
          <input type="text" id="api-model" placeholder="gpt-4o-mini" required>
          <small>例如 gpt-4o、gpt-4o-mini、deepseek-chat</small>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('settings-modal').classList.add('hidden')">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
